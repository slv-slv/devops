name: Deploy

on:
  push:
    branches: [week5]

jobs:
  checks:
    uses: ./.github/workflows/typecheck.yaml

    # runs-on: ubuntu-latest
    # steps:
    #   - uses: actions/checkout@v4
    #   - uses: actions/setup-node@v4
    #     with:
    #       node-version: '20'
    #       cache: 'npm'
    #   - run: npm ci && npm test

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: back
            context: back
            image: todo-back
            build_args: ''
          - service: front
            context: front
            image: todo-front
            build_args: --build-arg VITE_API_URL=${{ vars.VITE_API_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Вход в Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        run: |
          printf '%s' "$DOCKER_PASS" |
            docker login --username "$DOCKER_USER" --password-stdin

      - name: Build и push ${{ matrix.service }}
        env:
          IMAGE_SHA: ${{ secrets.DOCKER_USER }}/${{ matrix.image }}:sha-${{ github.sha }}
          IMAGE_LATEST: ${{ secrets.DOCKER_USER }}/${{ matrix.image }}:latest
          BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          docker build \
            --platform linux/amd64 \
            $BUILD_ARGS \
            -t $IMAGE_SHA \
            -t $IMAGE_LATEST \
            "${{ matrix.context }}"

          docker push $IMAGE_SHA
          docker push $IMAGE_LATEST

  # Альтернативы для деплоя:
  #   docker/build-push-action — собрать и запушить образ; деплой потом отдельным шагом.
  #   easingthemes/ssh-deploy@main — другой популярный action, специально для синка файлов через rsync.
  #   webfactory/ssh-agent@v0.9.0 — поднимает ssh-agent на runner'е; дальше можно делать любые ssh/git push команды.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd ~/myapp

            sed -i "s|^APP_VERSION=.*|APP_VERSION=sha-${{ github.sha }}|" .env.development.compose

            docker compose --env-file .env.development.compose pull back front
            docker compose --env-file .env.development.compose up -d --no-deps back front

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke
        env:
          E2E_BASE_URL: ${{ vars.VITE_API_URL }}
        run: |
          # vars.VITE_API_URL у нас вида https://домен/api → отрежем /api
          export E2E_BASE_URL="${E2E_BASE_URL%/api}"
          bash scripts/smoke.sh

  # Альтернатива — использовать готовый action с встроенной поддержкой:
  # Например, dawidd6/action-send-mail, archive/github-actions-slack, и подобные часто имеют параметр if-failure или сами включают if: always() внутри.

  # Альтернатива ${{ needs.checks.result }} — ${{ job.status }}:
  # Это статус текущего job'а, не зависимого. Полезно когда уведомление шлёт сам deploy-job, а не отдельный notify

  notify:
    needs: [checks, build, deploy, verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CHECKS="${{ needs.checks.result }}"
          BUILD="${{ needs.build.result }}"
          DEPLOY="${{ needs.deploy.result }}"
          VERIFY="${{ needs.verify.result }}"

          if [ "$CHECKS" != "success" ]; then
            TEXT="❌ Type-check упал%0A${{ github.repository }} @ ${{ github.ref_name }}%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          elif [ "$BUILD" != "success" ]; then
            TEXT="❌ Build упал%0A${{ github.repository }} @ ${{ github.ref_name }}%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          elif [ "$DEPLOY" != "success" ]; then
            TEXT="❌ Deploy упал%0A${{ github.repository }} @ ${{ github.ref_name }}%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          elif [ "$VERIFY" != "success" ]; then
            TEXT="❌ Smoke не прошёл (задеплоено, но не отвечает корректно)%0A${{ github.repository }} @ ${{ github.ref_name }}%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            TEXT="✅ Деплой успешен%0A${{ github.repository }} @ ${{ github.ref_name }}%0AActor: ${{ github.actor }}%0AVersion: sha-${{ github.sha }}"
          fi

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=$TEXT" \
            -d "disable_web_page_preview=true")

          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || {
            echo "Telegram API rejected"
            exit 1
          }
